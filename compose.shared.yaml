# Standalone shared-host profile. Never merge with the full lab/CPU/public overlays.
name: observatory-shared

x-limits: &limits
  restart: "on-failure:3"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}
  networks: [backend]

services:
  gateway:
    <<: *limits
    # A normal bridge is needed for loopback publishing; model stays backend-only.
    networks: [backend, access]
    build: .
    ports: ['127.0.0.1:18000:8000']
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    tmpfs: ['/tmp:size=16m,mode=1777']
    environment:
      OBSERVATORY_ASSISTANT_ONLY: 'true'
      ASSISTANT_DB: /app/data/assistant.sqlite
      ASSISTANT_ENABLE_CPU: ${SHARED_ENABLE_CPU:-true}
      ASSISTANT_CPU_URL: http://model:8080/v1
      ASSISTANT_CPU_MODEL: servingops-cpu
      ASSISTANT_DEADLINE_SECONDS: '90'
      ASSISTANT_CONTEXT_TOKENS: '4096'
      ASSISTANT_MAX_OUTPUT_TOKENS: '64'
      ASSISTANT_MONTHLY_TOKENS: '100000'
      # No collector or paid provider in this profile; spans are not exported.
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      OBSERVATORY_PROMETHEUS_URL: http://prometheus:9090
    command: [uvicorn, observatory.app:app, --host, 0.0.0.0, --port, '8000', --workers, '1', --limit-concurrency, '16', --no-access-log]
    volumes: [assistant-data:/app/data]
    stop_grace_period: 100s
    depends_on:
      model: {condition: service_healthy}

  model:
    <<: *limits
    image: ghcr.io/ggml-org/llama.cpp:server-b10015@sha256:6bc9134e3278a0ecab23d7ef2f6a46b4595740014fe9bc2f67e8ba7dca8395b4
    command: [--model, /models/qwen2.5-1.5b-instruct-q4_k_m.gguf, --alias, servingops-cpu, --host, 0.0.0.0, --port, '8080', --ctx-size, '4096', --parallel, '1', --threads, '1', --threads-batch, '1', --n-gpu-layers, '0', --metrics, --no-webui, --log-disable]
    volumes: ['./models:/models:ro,Z']
    cpus: 0.5
    mem_limit: 2560m
    memswap_limit: 2560m
    tmpfs: ['/tmp:size=32m,mode=1777']
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  prometheus:
    <<: *limits
    networks: [backend, access]
    profiles: [metrics]
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/shared.yaml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h, --storage.tsdb.retention.size=128MB, --query.max-concurrency=2, --query.max-samples=100000, --query.timeout=10s]
    environment: {GOMAXPROCS: '1', GOMEMLIMIT: 192MiB}
    ports: ['127.0.0.1:19090:9090']
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    tmpfs: ['/tmp:size=16m,mode=1777']
    volumes:
      - ./observability/prometheus-shared.yaml:/etc/prometheus/shared.yaml:ro,Z
      - ./observability/alerts-shared.yaml:/etc/prometheus/alerts-shared.yaml:ro,Z
      - metrics-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:9090/-/ready]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  backend: {internal: true}
  access: {}
volumes:
  assistant-data:
  metrics-data:
