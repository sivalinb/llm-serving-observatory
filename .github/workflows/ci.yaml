name: Validate observatory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PASSWORD: ci-only-ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check . && pytest -q
      - run: python scripts/evaluate_retrieval.py
      - run: node --check observatory/static/app.js && node --check observatory/static/hardware.js && node --check observatory/static/assistant.js
      - run: node --check observatory/static/home.js && node --test tests/home-tour.test.cjs
      - run: node --check sites/academy.js && node --test tests/academy.test.cjs
      - run: python scripts/build_portfolio.py
      - run: docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yaml
      - run: docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus-shared.yaml
      - run: docker compose -f compose.shared.yaml --profile metrics config --quiet
      - run: docker compose config --quiet
      - run: GRAFANA_PASSWORD=ci-only docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.cpu.yaml -f compose.observability.yaml -f compose.cpu-observability.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.observability.yaml up -d --build --wait
      - run: python scripts/smoke.py --url http://127.0.0.1:8000
      - run: python scripts/check_observability.py
      - run: LAB_API_KEY=ci-only DOMAIN=http://localhost ACME_EMAIL=ci@example.com docker compose -f compose.yaml -f compose.public.yaml up -d caddy
      - run: python scripts/check_public.py --url http://localhost
      - run: docker compose -f compose.yaml -f compose.observability.yaml logs --tail=60
        if: failure()
      - run: LAB_API_KEY=ci-only DOMAIN=http://localhost ACME_EMAIL=ci@example.com docker compose -f compose.yaml -f compose.observability.yaml -f compose.public.yaml down
        if: always()
  real-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            files: compose.yaml:compose.cpu.yaml
            port: 8000
            metrics: ''
          - profile: shared
            files: compose.shared.yaml
            port: 18000
            metrics: metrics
    env:
      COMPOSE_FILE: ${{ matrix.files }}
      COMPOSE_PROFILES: ${{ matrix.metrics }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          key: qwen-cpu-6a1a2eb6d15622bf
      - run: python scripts/download_model.py
      - run: docker compose up -d --build --wait --wait-timeout 660
      - run: python scripts/smoke_assistant.py --url http://127.0.0.1:${{ matrix.port }}
      - if: matrix.profile == 'shared'
        run: python scripts/check_shared_runtime.py
      - run: docker compose logs --tail=40
        if: failure()
      - run: docker compose down
        if: always()
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.9.8'}
      - run: terraform -chdir=infra/oci init -backend=false
      - run: terraform -chdir=infra/oci validate
