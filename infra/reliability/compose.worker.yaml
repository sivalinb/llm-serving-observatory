# Install under /etc/observatory-reliability for SELinux-compatible timer execution.
# Reuses existing external resources; never creates/restarts the application stack.
name: observatory-reliability-jobs
services:
  reliability:
    image: observatory-reliability:local
    pull_policy: never
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.1
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 32
    tmpfs: ['/tmp:size=16m,mode=1777']
    networks: [access]
    volumes:
      - assistant-data:/source:ro
      - ${RELIABILITY_PRIVATE_DIR:?Set a dedicated protected directory}:/private:rw,z
      - ${RELIABILITY_PRIVATE_DIR:?Set a dedicated protected directory}/config.json:/private/config.json:ro,z
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '2'}
    command: [--config, /private/config.json, probe]
networks:
  access: {external: true, name: observatory-shared_access}
volumes:
  assistant-data: {external: true, name: observatory-shared_assistant-data}
