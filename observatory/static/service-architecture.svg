<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">ServingOps Cloud — Phoenix CPU-first architecture</title><desc id="desc">Public HTTPS traffic passes through Caddy's allowlist to an invite-authenticated application. Atomic SQLite quotas admit one request to approved documentation retrieval and a private llama.cpp CPU model. Request receipts, metrics and traces report real measurements. The simulation lab is private and separate.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3b9278" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#193a33}.small{font-size:13px;fill:#5c786d}.label{font-size:11px;letter-spacing:1.7px;font-weight:700;fill:#3b826a}.title{font-size:19px;font-weight:700}.box{fill:white;stroke:#cadfd2;stroke-width:1.5}.line{fill:none;stroke:#3b9278;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#98aea3;stroke-width:1.5;stroke-dasharray:6 5}</style></defs>
<rect width="1200" height="730" rx="16" fill="#f4f8f2"/>
<text x="42" y="43" class="label">SERVINGOPS CLOUD / DEPLOYMENT BLUEPRINT</text><text x="42" y="77" font-size="28" font-weight="700">One real request. Every boundary visible.</text>
<text x="42" y="104" class="small">Target: us-phoenix-1 · Always Free eligible A1 · 2 OCPU / 12 GB design budget · Verify tenancy allowance first</text>
<rect x="30" y="143" width="182" height="160" rx="12" class="box"/><text x="50" y="172" class="label">PUBLIC INTERNET</text><text x="50" y="205" class="title">Invited browser</text><text x="50" y="234" class="small">Key held in page memory</text><text x="50" y="259" class="small">Question → streamed text</text><text x="50" y="284" class="small">Sources + timing receipt</text>
<rect x="242" y="127" width="925" height="415" rx="18" fill="#e9f2e8" stroke="#b4ceb9" stroke-dasharray="7 5"/><text x="267" y="155" class="label">SINGLE OCI VM / NO PAID MANAGED INFERENCE</text>
<rect x="267" y="179" width="188" height="137" rx="12" class="box"/><text x="286" y="209" class="label">01 / EDGE</text><text x="286" y="239" class="title">Caddy HTTPS</text><text x="286" y="267" class="small">Assistant route allowlist</text><text x="286" y="289" class="small">Body cap · TLS · streaming</text>
<path d="M212 230H259" class="line"/><text x="214" y="218" font-size="10">443</text>
<rect x="491" y="179" width="295" height="137" rx="12" class="box"/><text x="511" y="209" class="label">02 / GATEWAY</text><text x="511" y="239" class="title">Authenticate → admit</text><text x="511" y="267" class="small">Hashed keys · user isolation · deduplication</text><text x="511" y="289" class="small">Daily + monthly quotas · one active answer</text><path d="M455 245H483" class="line"/>
<rect x="824" y="179" width="316" height="137" rx="12" class="box"/><text x="844" y="209" class="label">03 / RETRIEVAL</text><text x="844" y="239" class="title">Approved documentation</text><text x="844" y="267" class="small">Lexical top 3 · versioned reference excerpts</text><text x="844" y="289" class="small">No uploads, arbitrary URLs or tools</text><path d="M786 245H816" class="line"/>
<rect x="267" y="356" width="188" height="153" rx="12" class="box"/><text x="286" y="386" class="label">PRIVATE LAB</text><text x="286" y="416" class="title">Experiments</text><text x="286" y="442" class="small">Simulated disaggregation</text><text x="286" y="465" class="small">KV transfer + GPU planner</text><text x="286" y="488" class="small">Never public inference</text>
<rect x="491" y="356" width="295" height="153" rx="12" class="box"/><text x="511" y="386" class="label">DURABLE STATE / SQLITE WAL</text><text x="511" y="416" class="title">Identity + admission ledger</text><text x="511" y="442" class="small">Atomic reserve → reconcile reported usage</text><text x="511" y="465" class="small">7-day metadata · 90-day minimal quota ledger</text><text x="511" y="488" class="small">No stored questions or answers · online backup</text><path d="M638 316V348" class="line"/>
<rect x="824" y="356" width="316" height="153" rx="12" fill="#125d4d"/><text x="844" y="386" style="fill:#b4dec5;font-size:11px;letter-spacing:1.7px;font-weight:700">04 / PRIVATE MODEL CONTAINER</text><text x="844" y="416" style="fill:white;font-size:19px;font-weight:700">llama.cpp · Qwen 1.5B Q4</text><text x="844" y="442" style="fill:#d5e7dc;font-size:13px">Real combined prefill + decode · CPU RAM</text><text x="844" y="465" style="fill:#d5e7dc;font-size:13px">Short context · deadline · cancellation</text><text x="844" y="488" style="fill:#d5e7dc;font-size:13px">No GPU, HBM or cross-worker KV transfer</text><path d="M981 316V348" class="line"/>
<path d="M1140 431H1152V524H807V327H661V314" class="line"/><text x="846" y="538" font-size="10">Streamed output + server-reported usage return to gateway</text>
<rect x="30" y="580" width="1137" height="120" rx="14" fill="#fff" stroke="#cadfd2"/><text x="52" y="608" class="label">PRIVATE OPERATIONS / LOOPBACK + SSH TUNNEL ONLY</text><text x="52" y="640" class="title">Prometheus → Grafana</text><text x="52" y="667" class="small">TTFT · E2E · chunk gaps · tokens · admissions · CPU / RSS</text><text x="532" y="640" class="title">OpenTelemetry → Tempo</text><text x="532" y="667" class="small">Request + model spans · no prompt attributes</text><text x="943" y="640" class="title">Operator CLI</text><text x="943" y="667" class="small">Invite · revoke · backup</text><path d="M648 542V572" class="line"/>
</svg>
