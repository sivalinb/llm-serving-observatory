<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">Request lifecycle, token ledger and measurement boundaries</title><desc id="desc">A step-by-step flow illustrates queue, prefill, KV transfer, decode reasoning, first visible token and remaining decode. TTFT and TPOT use explicit endpoints. Input and output totals contain their cached and reasoning subsets.</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#91a8c4"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e9f0f8}.title{font-size:34px;font-weight:600;letter-spacing:-1px}.kicker{font-size:12px;letter-spacing:1.6px;fill:#6fe3d4}.label{font-size:18px;font-weight:600}.body{font-size:15px;fill:#adc0d5}.small{font-size:12px;fill:#9fb5cd}.mono{font-size:14px;font-family:Menlo,monospace;fill:#c5d7e9}.line{stroke:#91a8c4;stroke-width:1.8;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1440" height="1020" fill="#09111c"/><text x="48" y="44" class="kicker">REQUEST LIFECYCLE / 02</text><text x="48" y="91" class="title">Where the time — and the tokens — go</text><text x="48" y="123" class="body">Illustrative sequence. Actual durations are measured by each request; this diagram is not a benchmark.</text>
<rect x="48" y="159" width="1344" height="295" rx="12" fill="#101c2b" stroke="#30445c"/>
<text x="74" y="191" class="kicker">GATEWAY → FIRST VISIBLE CONTENT → COMPLETION</text>
<g><rect x="75" y="221" width="150" height="118" rx="8" fill="#1b2a3d" stroke="#3e536d"/><text x="91" y="246" class="small">01 / ADMISSION</text><text x="91" y="276" class="label">Validate &amp; queue</text><text x="91" y="304" class="small">start monotonic clock</text><text x="91" y="324" class="small">trace context established</text></g>
<path d="M225 278H255" class="line"/>
<g><rect x="255" y="221" width="165" height="118" rx="8" fill="#153234" stroke="#438b82"/><text x="270" y="246" class="small">02 / PREFIX LOOKUP</text><text x="270" y="276" class="label">Prefill</text><text x="270" y="304" class="small">compute uncached input</text><text x="270" y="324" class="small">create / reuse KV state</text></g>
<path d="M420 278H450" class="line"/>
<g><rect x="450" y="221" width="167" height="118" rx="8" fill="#332a1f" stroke="#96764e"/><text x="466" y="246" class="small">03 / DISAGG ONLY</text><text x="466" y="276" class="label">KV handoff</text><text x="466" y="304" class="small">setup + transfer + wait</text><text x="466" y="324" class="small">combined: local reuse</text></g>
<path d="M617 278H647" class="line"/>
<g><rect x="647" y="221" width="160" height="118" rx="8" fill="#2c223a" stroke="#8c6ca4"/><text x="663" y="246" class="small">04 / OPTIONAL</text><text x="663" y="276" class="label">Reasoning</text><text x="663" y="304" class="small">generated output subset</text><text x="663" y="324" class="small">no reasoning text logged</text></g>
<path d="M807 278H837" class="line"/>
<g><rect x="837" y="213" width="170" height="134" rx="8" fill="#17383a" stroke="#6fe3d4" stroke-width="2"/><text x="854" y="246" class="small">05 / TTFT ENDPOINT</text><text x="854" y="276" class="label">First visible token</text><text x="854" y="304" class="small">first nonempty content</text><text x="854" y="326" class="small">ignore role / empty events</text></g>
<path d="M1007 278H1037" class="line"/>
<g><rect x="1037" y="221" width="165" height="118" rx="8" fill="#202b44" stroke="#6c84ad"/><text x="1053" y="246" class="small">06 / DECODE LOOP</text><text x="1053" y="276" class="label">Visible tokens 2…N</text><text x="1053" y="304" class="small">reuse + extend KV state</text><text x="1053" y="324" class="small">stream to the client</text></g>
<path d="M1202 278H1230" class="line"/><circle cx="1269" cy="278" r="32" fill="#183c38" stroke="#6fe3d4"/><text x="1256" y="286" font-size="24" fill="#6fe3d4">✓</text><text x="1230" y="333" class="small">Last content</text>
<path d="M75 368V379H922V368" stroke="#6fe3d4" stroke-width="2" fill="none"/><text x="358" y="405" class="mono">TTFT = first visible − gateway dispatch</text><path d="M922 368V379H1269V368" stroke="#82b4ff" stroke-width="2" fill="none"/><text x="956" y="405" class="mono">Visible decode interval</text><text x="75" y="433" class="small">E2E continues through final usage / stream end. TPOT excludes trailing usage and network teardown. N ≤ 1 → TPOT is unavailable.</text>
<rect x="48" y="479" width="651" height="210" rx="10" fill="#101c2b" stroke="#30445c"/><text x="73" y="512" class="kicker">TOKEN LEDGER / SUBSETS, NEVER DOUBLE-COUNT</text>
<rect x="75" y="536" width="283" height="49" rx="5" fill="#173e3e"/><rect x="75" y="536" width="94" height="49" rx="5" fill="#2d6d66"/><text x="90" y="566" class="small">Cached</text><text x="186" y="566" class="body">Uncached input</text><text x="75" y="607" class="small">INPUT includes both sections</text>
<rect x="384" y="536" width="283" height="49" rx="5" fill="#263657"/><rect x="384" y="536" width="99" height="49" rx="5" fill="#69496e"/><text x="395" y="566" class="small">Reasoning</text><text x="501" y="566" class="body">Visible output</text><text x="384" y="607" class="small">OUTPUT includes both sections*</text>
<text x="75" y="641" class="mono">total_tokens = input_tokens + output_tokens</text><text x="75" y="670" class="small">*Text-only simulator. Providers can expose additional output categories.</text>
<rect x="723" y="479" width="669" height="210" rx="10" fill="#101c2b" stroke="#30445c"/><text x="749" y="512" class="kicker">MEASUREMENT CONTRACT</text><text x="749" y="546" class="mono">TPOT = (t_last_visible − t_first_visible) / (N − 1)</text><text x="749" y="577" class="body">Simulator: one emitted unit = one synthetic token.</text><text x="749" y="606" class="body">Upstream: one chunk can contain many model tokens.</text><text x="749" y="635" class="body">Provider reasoning counts: record when reported; otherwise null.</text><text x="749" y="665" class="small">Never infer hidden token counts from elapsed time or visible text.</text>
<rect x="48" y="714" width="1344" height="210" rx="10" fill="#0e2228" stroke="#315750"/><text x="73" y="748" class="kicker">AFTER EVERY REQUEST / SUCCESS, ERROR, OR CANCELLATION</text>
<text x="75" y="788" class="label">1. End spans</text><text x="75" y="816" class="body">Local monotonic durations</text><text x="75" y="843" class="small">Worker spans retain worker clock.</text><text x="75" y="867" class="small">No cross-host clock subtraction.</text>
<text x="405" y="788" class="label">2. Record evidence</text><text x="405" y="816" class="body">Status · usage · trace ID</text><text x="405" y="843" class="small">Unavailable measurements stay null.</text><text x="405" y="867" class="small">Prompts and responses stay out of storage.</text>
<text x="753" y="788" class="label">3. Export telemetry</text><text x="753" y="816" class="body">Metrics · traces · logs</text><text x="753" y="843" class="small">p50 / p95 / p99 · SLO goodput</text><text x="753" y="867" class="small">Separate simulated and real sources.</text>
<text x="1090" y="788" class="label">4. Release capacity</text><text x="1090" y="816" class="body">Always release worker slots</text><text x="1090" y="843" class="small">Cancel upstream / child work.</text><text x="1090" y="867" class="small">A failed transfer is not a cache hit.</text>
<text x="48" y="962" class="body">Transfer model: setup_seconds + KV_bytes / bytes_per_second. Effective bandwidth is an observation, not the configured link rate.</text><text x="48" y="991" class="small">A realistic engine may emit its first token during prefill, overlap transfer with compute, or interleave reasoning and text. This lab uses the explicit sequence above.</text>
</svg>
