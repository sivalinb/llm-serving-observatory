<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">LLM Serving Observatory — system architecture</title><desc id="desc">An OCI-hosted gateway routes requests through a combined simulator, separate simulated HTTP workers, or an external real model engine. Prometheus metrics, OpenTelemetry traces, SQLite experiment records, and optional OCI exports provide observability. GPU deployment is an optional external environment requiring hardware validation.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#152437" stroke-width=".6"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#91a8c4"/></marker><marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#6fe3d4"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e9f0f8}.title{font-size:35px;font-weight:600;letter-spacing:-1px}.kicker{font-size:12px;font-weight:600;letter-spacing:2px;fill:#6fe3d4}.label{font-size:17px;font-weight:600}.body{font-size:14px;fill:#a9bdd4}.small{font-size:12px;fill:#9db2ca}.mono{font-family:Menlo,monospace;font-size:12px;fill:#b7cbdf}.node{fill:#142235;stroke:#344962;stroke-width:1.3}.line{fill:none;stroke:#91a8c4;stroke-width:1.8;marker-end:url(#a)}.telemetry{fill:none;stroke:#6fe3d4;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#c)}.accent{fill:#6fe3d4}.amber{fill:#ffc27a}</style></defs>
<rect width="1440" height="1110" fill="#09111c"/><rect width="1440" height="1110" fill="url(#grid)"/>
<text x="48" y="44" class="kicker">SYSTEM ARCHITECTURE / 01</text><text x="48" y="92" class="title">LLM Serving Observatory</text><text x="48" y="124" class="body">A measurable path from CPU simulation to real prefill / decode serving on OCI.</text>
<rect x="1100" y="42" width="292" height="77" rx="8" fill="#132a2d" stroke="#346963"/><text x="1120" y="69" class="kicker">IMPLEMENTATION BOUNDARY</text><text x="1120" y="93" class="small">Solid = request path · dashed = telemetry</text>
<rect x="40" y="152" width="1360" height="590" rx="14" fill="#0c1726" stroke="#31485f"/><text x="64" y="181" class="kicker">OCI A1 VM / DOCKER COMPOSE / CPU LAB</text><text x="898" y="181" class="small">Loopback by default · optional Caddy TLS ingress</text>
<rect x="65" y="220" width="204" height="135" rx="10" class="node"/><text x="84" y="250" class="small">CLIENTS</text><text x="84" y="279" class="label">Interactive dashboard</text><text x="84" y="305" class="body">Live tokens · waterfall</text><text x="84" y="330" class="body">Benchmarks · JSON export</text>
<rect x="65" y="387" width="204" height="96" rx="10" class="node"/><text x="84" y="417" class="label">SDK / load generator</text><text x="84" y="445" class="mono">/v1/chat/completions</text><text x="84" y="467" class="small">Streaming + non-streaming subset</text>
<path d="M269 283H323" class="line"/><path d="M269 434H296V319H323" class="line"/>
<rect x="323" y="220" width="274" height="264" rx="10" fill="#133037" stroke="#4e9e98" stroke-width="1.5"/><text x="346" y="251" class="kicker">CONTROL PLANE</text><text x="346" y="282" class="label">FastAPI gateway</text><text x="346" y="313" class="body">Validate + authenticate</text><text x="346" y="340" class="body">Admission / request timeout</text><text x="346" y="367" class="body">Select serving mode</text><text x="346" y="394" class="body">Propagate W3C trace context</text><text x="346" y="421" class="body">Measure arrivals + token usage</text><text x="346" y="454" class="mono">SSE → client · 60 s deadline</text>
<path d="M597 270H662" class="line"/><text x="612" y="251" class="small">A</text>
<rect x="662" y="219" width="686" height="99" rx="10" class="node"/><text x="685" y="248" class="label">Combined simulator</text><text x="685" y="275" class="body">Queue → prefill → decode → stream</text><text x="685" y="299" class="small">One slot owns the whole request · prefix LRU · synthetic output</text><rect x="1157" y="239" width="169" height="52" rx="7" fill="#222c40"/><text x="1173" y="271" class="mono">NO KV TRANSFER</text>
<path d="M597 355H638V390H662" class="line"/><text x="613" y="338" class="small">B</text>
<rect x="662" y="350" width="245" height="131" rx="10" fill="#133034" stroke="#408c83"/><text x="683" y="378" class="kicker">SIMULATED / HTTP</text><text x="683" y="406" class="label">Prefill worker</text><text x="683" y="433" class="body">Own queue · prefix cache</text><text x="683" y="457" class="small">Returns a KV size descriptor</text>
<rect x="1101" y="350" width="247" height="131" rx="10" fill="#202a45" stroke="#687faa"/><text x="1121" y="378" class="kicker">SIMULATED / HTTP</text><text x="1121" y="406" class="label">Decode worker</text><text x="1121" y="433" class="body">Own queue · synthetic tokens</text><text x="1121" y="457" class="small">Separate OTel child spans</text>
<path d="M907 414H1101" class="line"/><text x="931" y="383" class="small amber">MODELED HANDOFF</text><text x="931" y="440" class="small">setup + bytes / rate</text><text x="931" y="460" class="small">No tensors on wire</text>
<path d="M458 484V529" class="line"/><text x="64" y="539" class="small">SSE content returns through gateway.</text><text x="64" y="562" class="small">Never log prompts or reasoning text.</text>
<rect x="323" y="529" width="274" height="96" rx="10" class="node"/><text x="345" y="559" class="label">SQLite WAL</text><text x="345" y="585" class="body">Trace summaries + experiments</text><text x="345" y="608" class="small">Bounded retention · single gateway</text>
<rect x="662" y="523" width="686" height="174" rx="10" fill="#26241e" stroke="#8b7049" stroke-dasharray="6 4"/><text x="684" y="552" class="kicker amber">C / REAL INFERENCE ADAPTER — EXTERNAL ENGINE</text><text x="684" y="583" class="label">llama.cpp CPU  /  vLLM GPU  /  vLLM P–D proxy</text><text x="684" y="610" class="body">Configured URL + model → forward chat stream → normalize reported usage</text><text x="684" y="638" class="small">Gateway measures TTFT and chunk gaps. Real prefill / KV metrics come from engines.</text><text x="684" y="665" class="small">Optional GPU recipe: prefill GPU → NIXL KV tensors → decode GPU. Hardware validation required.</text><path d="M597 451H628V581H662" class="line"/>
<path d="M460 625V719H714V785" class="telemetry"/><path d="M1004 697V720H1181V785" class="telemetry"/>
<rect x="40" y="773" width="1360" height="209" rx="14" fill="#0d2027" stroke="#315552"/><text x="65" y="804" class="kicker">OBSERVABILITY PLANE / OPTIONAL COMPOSE PROFILE</text>
<rect x="66" y="830" width="266" height="124" rx="8" class="node"/><text x="85" y="860" class="label">Prometheus → Grafana</text><text x="85" y="886" class="body">Latency · tokens · cache · SLOs</text><text x="85" y="912" class="small">Scrape gateway + workers + engines</text><text x="85" y="935" class="mono">/metrics · bounded labels</text>
<rect x="361" y="830" width="266" height="124" rx="8" class="node"/><text x="380" y="860" class="label">OTel collector → Tempo</text><text x="380" y="886" class="body">Trace IDs cross HTTP services</text><text x="380" y="912" class="small">Gateway clock + worker-local clocks</text><text x="380" y="935" class="mono">OTLP/HTTP · batch export</text>
<rect x="656" y="830" width="325" height="124" rx="8" class="node"/><text x="675" y="860" class="label">Structured logs + local records</text><text x="675" y="886" class="body">Correlate request ID and trace ID</text><text x="675" y="912" class="small">Failures · cancellations · experiment config</text><text x="675" y="935" class="mono">JSON export → repeatable analysis</text>
<rect x="1010" y="830" width="364" height="124" rx="8" fill="#26241e" stroke="#8b7049"/><text x="1029" y="860" class="label">OCI integration / opt-in</text><text x="1029" y="886" class="body">Object Storage · Monitoring · ADB</text><text x="1029" y="912" class="small">Export script uses local OCI configuration</text><text x="1029" y="935" class="small">APM OTLP collector configuration in runbook</text>
<path d="M65 708H199V830" class="telemetry"/><text x="65" y="686" class="small accent">All service /metrics endpoints</text><path d="M787 481V508H616V760H494V830" class="telemetry"/>
<text x="48" y="1020" class="kicker">WHAT THIS PROVES</text><text x="48" y="1050" class="body">Request lifecycle · queueing · phase isolation · cache accounting · observability design · reproducible workload execution</text><text x="48" y="1080" class="small">Simulation results are not GPU throughput claims. Equal-resource GPU comparisons and real KV transfer require the optional hardware deployment.</text>
</svg>
