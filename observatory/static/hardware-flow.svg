<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">From request to silicon: CPU, RAM, GPU compute and HBM</title>
<desc id="desc">In a GPU-backed serving system, the CPU orchestrates requests using host RAM. GPU prefill and decode compute read model weights and KV from device memory. Disaggregation adds a separate network or interconnect handoff. The Observatory measures CPU resources locally, estimates GPU capacity analytically, and integrates real GPU metrics only through an external exporter.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#8fa6bf"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#e9f0f8}.title{font-size:34px;font-weight:600;letter-spacing:-1px}.label{font-size:20px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#a8bad0}.kicker{font-size:13px;letter-spacing:1.6px;fill:#6fe3d4}.line{stroke:#8fa6bf;stroke-width:2;fill:none;marker-end:url(#arrow)}.muted{fill:#a8bad0}.amber{fill:#ffc27a}</style>
<rect width="1280" height="1030" fill="#09111c"/>
<text x="40" y="40" class="kicker">HARDWARE &amp; MEMORY / 03</text><text x="40" y="88" class="title">Capacity is space. Bandwidth is movement.</text>
<text x="40" y="118" class="body muted">Conceptual GPU serving path · the CPU lab does not allocate GPU tensors</text>
<rect x="40" y="150" width="1200" height="165" rx="12" fill="#101c2b" stroke="#34465e"/>
<text x="64" y="178" class="kicker">01 / HOST — TWO DISTINCT RESOURCES</text>
<rect x="64" y="194" width="550" height="96" rx="8" fill="#17273b"/><text x="84" y="224" class="label">CPU · orchestration</text><text x="84" y="253" class="body">HTTP → tokenize → queue → schedule → stream</text><text x="84" y="276" class="small">CPU-only engines can also perform model computation here.</text>
<rect x="666" y="194" width="550" height="96" rx="8" fill="#17273b"/><text x="686" y="224" class="label">System RAM · host memory</text><text x="686" y="253" class="body">Application state, buffers, optional weights / KV offload</text><text x="686" y="276" class="small">Host available RAM ≠ process RSS ≠ container allowance.</text><path d="M616 242H662" class="line"/>
<path d="M328 315V357" class="line"/><path d="M952 315V357" class="line"/><text x="492" y="343" class="small">Host ↔ device link is not HBM bandwidth</text>
<rect x="40" y="362" width="535" height="332" rx="12" fill="#0f242b" stroke="#417d78"/><text x="64" y="392" class="kicker">02A / PREFILL DEVICE</text>
<rect x="64" y="412" width="487" height="88" rx="8" fill="#17383d"/><text x="84" y="442" class="label">GPU compute</text><text x="84" y="473" class="body">Parallel prompt processing · often compute-heavy</text>
<path d="M196 503V531" class="line"/><path d="M416 536V506" class="line"/>
<rect x="64" y="542" width="487" height="122" rx="8" fill="#142235" stroke="#45627f"/><text x="84" y="571" class="label">Device memory · HBM on some GPUs</text>
<rect x="84" y="588" width="152" height="34" rx="3" fill="#344e70"/><text x="100" y="611" class="body">Model weights</text><rect x="245" y="588" width="131" height="34" rx="3" fill="#22564f"/><text x="258" y="611" class="body">Prompt KV</text><rect x="385" y="588" width="146" height="34" rx="3" fill="#54442f"/><text x="397" y="611" class="body">Workspace</text><text x="84" y="649" class="small">Capacity limits fit; bandwidth feeds GPU compute.</text>
<rect x="705" y="362" width="535" height="332" rx="12" fill="#161f35" stroke="#526b98"/><text x="729" y="392" class="kicker">02B / DECODE DEVICE</text>
<rect x="729" y="412" width="487" height="88" rx="8" fill="#24304b"/><text x="749" y="442" class="label">GPU compute</text><text x="749" y="473" class="body">One token / sequence / step · reads reused state</text>
<path d="M861 503V531" class="line"/><path d="M1081 536V506" class="line"/>
<rect x="729" y="542" width="487" height="122" rx="8" fill="#142235" stroke="#45627f"/><text x="749" y="571" class="label">Device memory · HBM on some GPUs</text>
<rect x="749" y="588" width="152" height="34" rx="3" fill="#344e70"/><text x="765" y="611" class="body">Model weights</text><rect x="910" y="588" width="143" height="34" rx="3" fill="#22564f"/><text x="923" y="611" class="body">Growing KV</text><rect x="1062" y="588" width="134" height="34" rx="3" fill="#54442f"/><text x="1073" y="611" class="body">Workspace</text><text x="749" y="649" class="small">Often memory-bandwidth-limited at small batch sizes.</text>
<path d="M575 607H701" class="line"/><text x="640" y="535" text-anchor="middle" class="small amber">KV handoff</text><text x="640" y="558" text-anchor="middle" class="small">interconnect</text><text x="640" y="578" text-anchor="middle" class="small">or network</text><text x="640" y="638" text-anchor="middle" class="small amber">≠ HBM link</text>
<text x="40" y="727" class="body">Combined serving keeps these phases on one worker. Disaggregation separates them and adds a KV handoff.</text>
<rect x="40" y="756" width="1200" height="193" rx="12" fill="#101c2b" stroke="#34465e"/><text x="64" y="785" class="kicker">03 / THREE EVIDENCE LANES — NEVER MIX THEM</text>
<text x="64" y="823" class="label">Measured CPU / RAM</text><text x="64" y="852" class="body">psutil + optional cgroup v2</text><text x="64" y="879" class="small">Process cores / RSS / container limits</text><text x="64" y="906" class="small">Built in → Prometheus → Grafana</text>
<text x="463" y="823" class="label">Analytical GPU estimates</text><text x="463" y="852" class="body">Geometry + workload + assumptions</text><text x="463" y="879" class="small">Capacity budget / optimistic bounds</text><text x="463" y="906" class="small">Calculator → comparison JSON</text>
<text x="876" y="823" class="label">External GPU measurements</text><text x="876" y="852" class="body">DCGM + inference-engine metrics</text><text x="876" y="879" class="small">VRAM / SM / DRAM activity / KV</text><text x="876" y="906" class="small">Private exporter → Grafana</text>
<text x="40" y="982" class="small">DRAM activity is not GB/s. GPU utilization is not a bottleneck diagnosis. Correlate device metrics with TTFT, TPOT and traces.</text><text x="40" y="1008" class="small">The calculator uses one device with dense/GQA geometry; this conceptual two-device serving diagram is not its allocation model.</text>
</svg>
