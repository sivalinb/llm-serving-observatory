[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serving-observatory"
version = "0.3.0"
description = "An observable prefill/decode serving laboratory for OCI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "psutil>=7.2.2,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pyyaml>=6,<7", "python-hcl2>=7,<9"]
oci = ["oci>=2.140,<3", "oracledb>=3,<4"]

[tool.setuptools.package-data]
observatory = ["static/*"]

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
