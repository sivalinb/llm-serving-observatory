groups:
  - name: observatory
    rules:
      - alert: HighTTFT
        expr: histogram_quantile(0.95, sum by (le, mode, source) (rate(lab_ttft_seconds_bucket[5m]))) > 0.75
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'p95 first visible content is above 750 ms'
          description: 'Inspect queue, prefill and KV transfer spans. Group by source before interpreting.'
      - alert: HighTPOT
        expr: histogram_quantile(0.95, sum by (le, mode, source) (rate(lab_tpot_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'p95 visible TPOT exceeds 50 ms'
      - alert: RequestFailures
        expr: sum by (mode, source) (rate(lab_requests_total{status="error"}[5m])) / clamp_min(sum by (mode, source) (rate(lab_requests_total[5m])), 0.001) > 0.02
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Request failure ratio exceeds 2%'
      - alert: SimulatedPrefixCachePressure
        expr: lab_prefix_cache_bytes / lab_prefix_cache_capacity_bytes > 0.9
        for: 5m
        labels: {severity: info}
        annotations:
          summary: 'Modeled prefix cache exceeds 90%; inspect eviction counter'
      - alert: WorkerUnavailable
        expr: up{job="observatory"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'An observatory service is not responding to metric scrapes'
