groups:
  - name: observatory
    rules:
      - alert: HighTTFT
        expr: histogram_quantile(0.95, sum by (le, mode, source) (rate(lab_ttft_seconds_bucket[5m]))) > 0.75
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'p95 first visible content is above 750 ms'
          description: 'Inspect queue, prefill and KV transfer spans. Group by source before interpreting.'
      - alert: HighTPOT
        expr: histogram_quantile(0.95, sum by (le, mode, source) (rate(lab_tpot_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'p95 visible TPOT exceeds 50 ms'
      - alert: RequestFailures
        expr: sum by (mode, source) (rate(lab_requests_total{status="error"}[5m])) / clamp_min(sum by (mode, source) (rate(lab_requests_total[5m])), 0.001) > 0.02
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: 'Request failure ratio exceeds 2%'
      - alert: SimulatedPrefixCachePressure
        expr: lab_prefix_cache_bytes / lab_prefix_cache_capacity_bytes > 0.9
        for: 5m
        labels: {severity: info}
        annotations:
          summary: 'Modeled prefix cache exceeds 90%; inspect eviction counter'
      - alert: WorkerUnavailable
        expr: up{job="observatory"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: 'An observatory service is not responding to metric scrapes'
      - alert: ContainerMemoryPressure
        expr: lab_resource_cgroup_namespace_root_memory_current_bytes / lab_resource_cgroup_namespace_root_memory_limit_bytes > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Measured container memory exceeds 90% of its local cgroup-v2 limit'
          description: 'Inspect RSS and container usage separately. This is not GPU HBM pressure.'
      - alert: ContainerCPUThrottling
        expr: rate(lab_resource_cgroup_namespace_root_cpu_throttled_seconds_total[5m]) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'Container CPU throttling is sustained; correlate with queue delay and TTFT'
      - alert: ResourceSamplerUnavailable
        expr: lab_resource_sample_available == 0 or lab_resource_sample_age_seconds > 10
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Process resource telemetry is missing or stale'
      - alert: AssistantFailures
        expr: sum(increase(assistant_requests_total{status=~"error|timeout"}[15m])) >= 3
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Three or more real assistant failures in 15 minutes'
          description: 'Inspect model health and CPU/RAM pressure; turn off CPU inference if needed. Search remains available.'
      - alert: AssistantSlowFirstContent
        expr: histogram_quantile(0.95, sum by (le) (rate(assistant_ttft_seconds_bucket[15m]))) > 30
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: 'CPU beta p95 TTFT is above the provisional 30-second target'
      - alert: CPUModelUnavailable
        expr: up{job="inference-engine",hardware="cpu"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: 'Configured CPU model is not responding to scrapes'
