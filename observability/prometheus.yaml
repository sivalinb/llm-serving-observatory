global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: observatory
    static_configs:
      - targets: [gateway:8000]
        labels: {service: gateway}
      - targets: [prefill:8000]
        labels: {service: prefill}
      - targets: [decode:8000]
        labels: {service: decode}
  - job_name: inference-engine
    file_sd_configs:
      - files: [/etc/prometheus/engine-targets.json]
  - job_name: gpu-hardware
    file_sd_configs:
      - files: [/etc/prometheus/gpu-targets.json]
