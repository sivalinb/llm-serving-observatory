services:
  gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  prefill:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  decode:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  otel:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: [--config=/etc/otel/config.yaml]
    volumes: [./observability/otel.yaml:/etc/otel/config.yaml:ro]
    mem_limit: 256m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.retention.time=3d, --storage.tsdb.retention.size=512MB]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ./observability/engine-targets.json:/etc/prometheus/engine-targets.json:ro
      - ./observability/gpu-targets.json:/etc/prometheus/gpu-targets.json:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.7.2
    command: [--config.file=/etc/tempo.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 384m
    restart: unless-stopped
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
